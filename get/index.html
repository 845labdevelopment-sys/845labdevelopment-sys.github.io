<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>AirBoard を入れる | Get AirBoard</title>
<meta name="description" content="開いた端末に合うストア（App Store・Google Play・Microsoft Store）へ進みます。Opens the right store for this device.">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#0B1B3A">
<link rel="icon" href="/assets/img/AirBoard_icon_C1_rounded.svg" type="image/svg+xml">
<link rel="icon" href="/assets/img/favicon-64.png" sizes="64x64" type="image/png">
<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
<link rel="stylesheet" href="/assets/site.css">
<style>
  .get { max-width: 560px; margin: 0 auto; padding: 72px 20px 56px; text-align: center; }
  .get .icon { width: 88px; height: 88px; border-radius: 22px; }
  .get h1 { font-size: clamp(26px, 6vw, 34px); font-weight: 800; margin: 20px 0 10px; }
  .get p { color: var(--muted); font-size: 16px; margin: 0 0 8px; }
  .get .stores { display: grid; gap: 12px; margin-top: 28px; }
  .get .stores .btn { justify-content: center; }
  .get .note { margin-top: 24px; font-size: 14px; }
</style>
</head>
<body>
<main class="get">
  <img class="icon" src="/assets/img/icon-256.png" alt="AirBoard" width="88" height="88">
  <h1 id="title">AirBoard を入れる</h1>
  <p id="lead">この端末に合うストアを開いています…</p>
  <div class="stores">
    <a class="btn dark primary" id="ios" href="https://apps.apple.com/app/apple-store/id6768266068?pt=128890200&amp;ct=site_get&amp;mt=8" rel="noopener"><span><small>iPhone・iPad</small><b>App Store</b></span></a>
    <a class="btn dark" id="android" href="https://play.google.com/store/apps/details?id=com.AirBoard&amp;referrer=utm_source%3Dapp_guide%26utm_campaign%3Dsite_get" rel="noopener"><span><small>Android</small><b>Google Play</b></span></a>
    <a class="btn dark" id="windows" href="https://apps.microsoft.com/detail/9NDXC1X5SZB0?cid=site_get" rel="noopener"><span><small>Windows</small><b>Microsoft Store</b></span></a>
  </div>
  <p class="note" id="note">進まないときは、上のボタンから選んでください。Mac 版は Mac App Store で公開予定です。</p>
  <p class="note"><a href="/" id="home">AirBoard について</a></p>
</main>
<script>
(function () {
  // The campaign comes from the app (?src=app_ios_guide_qr …). Only [a-z0-9_]
  // is kept, so nothing else can reach the store URLs.
  var m = /[?&]src=([a-z0-9_]{1,40})(?:&|$)/.exec(location.search);
  var src = m ? m[1] : 'site_get';
  var urls = {
    ios: 'https://apps.apple.com/app/apple-store/id6768266068?pt=128890200&ct=' + src + '&mt=8',
    android: 'https://play.google.com/store/apps/details?id=com.AirBoard&referrer=' +
      encodeURIComponent('utm_source=app_guide&utm_campaign=' + src),
    windows: 'https://apps.microsoft.com/detail/9NDXC1X5SZB0?cid=' + src
  };
  for (var k in urls) document.getElementById(k).href = urls[k];

  var ua = navigator.userAgent || '';
  var device = 'other';
  if (/iPhone|iPad|iPod/.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1)) device = 'ios';
  else if (/Android/.test(ua)) device = 'android';
  else if (/Windows NT/.test(ua)) device = 'windows';

  var ja = /^ja\b/i.test(navigator.language || '');
  if (!ja) {
    document.documentElement.lang = 'en';
    document.title = 'Get AirBoard';
    document.getElementById('title').textContent = 'Get AirBoard';
    document.getElementById('home').textContent = 'About AirBoard';
    document.getElementById('note').textContent = 'If nothing happens, pick your store above. The Mac app is coming to the Mac App Store.';
  }
  var lead = document.getElementById('lead');
  if (device === 'other') {
    lead.textContent = ja
      ? 'AirBoard は iPhone・iPad、Android、Windows で使えます。入れたい端末でこのページを開くか、下から選んでください。'
      : 'AirBoard runs on iPhone, iPad, Android and Windows. Open this page on that device, or pick a store below.';
    return;
  }
  lead.textContent = ja ? 'この端末に合うストアを開いています…' : 'Opening the store for this device…';
  location.replace(urls[device]);
})();
</script>
</body>
</html>
